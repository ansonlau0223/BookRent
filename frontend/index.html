<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BookRent</title>
</head>

<body>

    <h1>BookRent</h1>

    <h2>Register / Login</h2>

    <input
        id="email"
        type="email"
        placeholder="Email"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <button onclick="registerUser()">
        Register
    </button>

    <button onclick="loginUser()">
        Login
    </button>

    <p id="message"></p>


    <h2>Books</h2>

    <button onclick="loadBooks()">
        Refresh Books
    </button>

    <div id="books"></div>


    <script>

        let accessToken = "";


        function showMessage(message) {
            document.getElementById(
                "message"
            ).textContent = message;
        }


        async function registerUser() {

            const email =
                document.getElementById(
                    "email"
                ).value;

            const password =
                document.getElementById(
                    "password"
                ).value;

            const response = await fetch(
                "/auth/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );

            if (response.ok) {
                showMessage(
                    "Registration successful."
                );
            }

            else {
                const data =
                    await response.json();
        
                if (Array.isArray(data.detail)) {
                    showMessage(
                        data.detail[0].msg
                    );
                }
                else {
                    showMessage(
                        data.detail
                    );
                }
            }
        }


        async function loginUser() {

            const email =
                document.getElementById(
                    "email"
                ).value;

            const password =
                document.getElementById(
                    "password"
                ).value;

            const response = await fetch(
                "/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );

            if (response.ok) {

                const data =
                    await response.json();

                accessToken =
                    data.access_token;

                showMessage(
                    "Login successful."
                );
            }

            else {

                showMessage(
                    "Login failed."
                );
            }
        }


        async function loadBooks() {

            const response =
                await fetch("/books");

            const books =
                await response.json();

            const bookContainer =
                document.getElementById(
                    "books"
                );

            bookContainer.innerHTML = "";


            for (const book of books) {

                const bookElement =
                    document.createElement(
                        "div"
                    );

                bookElement.innerHTML = `
                    <hr>

                    <strong>
                        ${book.title}
                    </strong>

                    <br>

                    Author:
                    ${book.author}

                    <br>

                    Available Copies:
                    ${book.availableCopies}

                    <br>

                    <button
                        onclick="rentBook(${book.id})"
                    >
                        Rent
                    </button>

                    <button
                        onclick="reserveBook(${book.id})"
                    >
                        Reserve
                    </button>
                `;

                bookContainer.appendChild(
                    bookElement
                );
            }
        }


        async function rentBook(bookId) {

            if (accessToken === "") {

                showMessage(
                    "Please login first."
                );

                return;
            }


            const response = await fetch(
                `/books/${bookId}/rentals`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${accessToken}`
                    },

                    body: JSON.stringify({
                        rentalPeriodDays: 30
                    })
                }
            );


            if (response.ok) {

                const data =
                    await response.json();

                showMessage(
                    `Rental successful. Copy: ${data.bookCopyId}`
                );

                loadBooks();
            }

            else {

                const data =
                    await response.json();

                showMessage(
                    data.detail
                );
            }
        }


        async function reserveBook(bookId) {

            if (accessToken === "") {

                showMessage(
                    "Please login first."
                );

                return;
            }


            const response = await fetch(
                `/books/${bookId}/reservations`,
                {
                    method: "POST",

                    headers: {
                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );


            if (response.ok) {

                const data =
                    await response.json();

                showMessage(
                    `Reservation created. ID: ${data.reservationId}`
                );
            }

            else {

                const data =
                    await response.json();

                showMessage(
                    data.detail
                );
            }
        }


        loadBooks();

    </script>

</body>
</html>
